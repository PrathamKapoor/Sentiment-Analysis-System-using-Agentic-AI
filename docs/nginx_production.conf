# Production nginx reverse-proxy configuration.
#
# This file is the documented edge for a Linux deployment. It is
# intentionally a separate file from the bundled Docker front-end so
# that operators who deploy without Docker can use it directly.
#
# Replace:
#   - backend.example.com with the public backend hostname
#   - app.example.com with the public frontend hostname
#   - the certbot paths with your actual certificate paths
#
# This configuration is for documentation purposes. It has NOT been
# runtime-verified in this environment because no public domain or
# certificate infrastructure is available.

# --- HTTP -> HTTPS redirect (port 80) ---
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS frontend (port 443) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static SPA build artifacts (nginx serves these directly).
    root /var/www/sams-frontend/dist;
    index index.html;

    # Long-cache hashed assets.
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML entry: revalidate every time so versioned assets are picked up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Reverse-proxy the API to the backend. The backend container
    # listens on 127.0.0.1:5000 by default. Set TRUSTED_PROXY_COUNT=1
    # in the backend so ProxyFix honors these X-Forwarded-* headers.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# --- HTTPS backend (optional direct API access) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend.example.com;

    ssl_certificate     /etc/letsencrypt/live/backend.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 32m;
    }
}

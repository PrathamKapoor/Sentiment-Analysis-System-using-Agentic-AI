<!doctype html>
<html><head><title>Customer reviews - Example product</title></head><body>
  <div id="R1" data-hook="review">
    <a data-hook="review-title"><span>Excellent camera</span></a>
    <span data-hook="review-body"><span>The camera is excellent and battery life is strong.</span></span>
    <span class="a-profile-name">Asha</span>
    <i data-hook="review-star-rating"><span>5.0 out of 5 stars</span></i>
    <span data-hook="review-date">Reviewed in India on 1 August 2026</span>
  </div>
  <div id="R2" data-hook="review">
    <span data-hook="review-body"><span>Display is bright, but the phone is heavy.</span></span>
    <span class="a-profile-name">Ravi</span>
  </div>
  <ul><li class="a-last a-disabled"><span>Next page</span></li></ul>
</body></html>

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-secret-key-not-used-for-real-auth-32b
          JWT_SECRET_KEY: ci-jwt-secret-not-used-for-real-auth-32b
        run: |
          python -m pytest -q

  postgres-migrations:
    name: PostgreSQL migration chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentiment_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FLASK_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sentiment_ci
      SECRET_KEY: ci-secret-key-not-used-for-real-auth-32b
      JWT_SECRET_KEY: ci-jwt-secret-not-used-for-real-auth-32b
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Exercises migration 0001 -> 0009, the latest downgrade, and a
      # re-upgrade against a real PostgreSQL server, in an isolated
      # schema. This is the automated form of the Phase 11 audit that
      # was previously a manual drill (scripts/audit_migration_postgres.py).
      - name: Run migration audit against real PostgreSQL
        run: |
          python -m scripts.audit_migration_postgres
      - name: Seed permissions and roles against PostgreSQL
        run: |
          flask --app run seed

  security-scans:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only: reported findings do not fail the build, because a
    # pinned-but-vulnerable transitive dependency should be triaged, not
    # block every unrelated push. Remove continue-on-error once the
    # findings are triaged to zero.
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm audit (frontend, production deps)
        working-directory: frontend
        run: npm audit --omit=dev

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build